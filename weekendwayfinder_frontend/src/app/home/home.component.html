<!-- Custom Home Page Navigation with AI Suggestions top-right -->
<div class="home-nav-row">
  <div class="home-logo-title">
    <span class="compass-icon">&#x1F9ED;</span>
    <span class="ww-nav-title">WeekendWayfinder</span>
  </div>
  <div class="home-nav-actions">
    <a routerLink="/sign-in" class="home-signin-btn">Sign In</a>
    <button class="ai-suggestions-nav-btn" (click)="onAISuggestions()">AI Suggestions</button>
  </div>
</div>
<div class="home-hero-bg">

  </div>
</div>
