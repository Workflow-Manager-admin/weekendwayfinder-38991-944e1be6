<div class="planner-bg">
  <div class="planner-container">
    <h2>Plan Your Weekend</h2>
    <form class="planner-form">
      <label for="distance">Max Travel Distance</label>
      <input id="distance" type="number" placeholder="e.g., 200 km" min="5">
      <label for="mood">Mood</label>
      <select id="mood">
        <option *ngFor="let mood of moods" [value]="mood.value">
          {{ mood.label }}
        </option>
      </select>
      <label for="budget">Budget (₹)</label>
      <input id="budget" type="number" placeholder="₹" min="1">
      <button type="submit">Get Suggestions</button>
    </form>
  </div>
</div>
