<div class="ai-suggestions-bg">
  <div class="ai-suggestions-container" style="max-width: 540px">
    <h2>AI Suggestions</h2>
    <p class="ai-desc">Here are smart trip ideas tailored for you! This is a sample preview of AI-powered suggestions for your next weekend getaway.</p>
    <div *ngIf="aiSuggestions && aiSuggestions.length > 0; else noSuggestionsBlock" class="suggestion-list">
      <h3 class="suggestion-title">AI Suggestions</h3>
      <ul>
        <li *ngFor="let suggestion of aiSuggestions" class="suggestion-card">
          <span class="suggestion-icon">&#128205;</span>
          <div class="suggestion-content">
            <strong>{{ suggestion.title }}</strong>
            <div class="suggestion-desc">{{ suggestion.description }}</div>
          </div>
        </li>
      </ul>
    </div>
    <ng-template #noSuggestionsBlock>
      <div class="suggestion-placeholder">
        <p style="margin:0;font-style:italic;">No AI trip suggestions available at the moment.</p>
      </div>
    </ng-template>
  </div>
</div>
